<!doctype html>
<html lang="en" class="scheme-only-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Effect Native Component Gallery</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: #030712;
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        overflow: auto;
      }

      #app {
        min-width: 320px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      const pathSegments = location.pathname.split("/").filter(Boolean)
      const storiesIndex = pathSegments.indexOf("stories")
      const hasFileExtension = /\/[^/]+\.[^/]+$/.test(location.pathname)
      const basePath =
        storiesIndex >= 0
          ? `/${pathSegments.slice(0, storiesIndex).join("/")}/`
          : location.pathname.endsWith("/")
            ? location.pathname
            : hasFileExtension
              ? location.pathname.replace(/[^/]*$/, "")
              : `${location.pathname}/`
      const normalizedBasePath = basePath === "//" ? "/" : basePath

      import(`${normalizedBasePath}app.js`)
    </script>
  </body>
</html>
